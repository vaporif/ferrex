name: Integration

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".claude/**"
      - ".serena/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".claude/**"
      - ".serena/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.ferrex/models

jobs:
  build-and-generate:
    name: Build & generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache fastembed models
        uses: actions/cache@v5
        with:
          path: .ferrex/models
          key: fastembed-models-${{ runner.os }}

      - name: Pre-download embedding models
        run: |
          cargo run --release -p ferrex-embed --example download_models
          ls -la "$FASTEMBED_CACHE_DIR"

      - name: Archive integration tests
        run: >
          cargo nextest archive
          --archive-file ferrex-integration.tar.zst
          -p ferrex-core -p ferrex-server
          --test '*'

      - uses: actions/upload-artifact@v7
        with:
          name: integration-archive
          path: ferrex-integration.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: fastembed-cache
          path: ${{ github.workspace }}/.ferrex/models
          if-no-files-found: error

      - name: Generate matrix
        id: matrix
        run: |
          matrix=$(python3 .github/scripts/generate-integration-matrix.py ferrex-integration.tar.zst)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.package }} / ${{ matrix.test }}
    needs: build-and-generate
    if: needs.build-and-generate.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-and-generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Keep in step with the qdrant the flake's dev shell provides.
      - name: Install qdrant
        env:
          QDRANT_VERSION: v1.16.3
          QDRANT_SHA256: 62e42e3e0fffd609365363be85b63ec27b215b8e7ac9929cf5736c49af0416ec
        run: |
          curl -sSfL -o qdrant.tar.gz "https://github.com/qdrant/qdrant/releases/download/${QDRANT_VERSION}/qdrant-x86_64-unknown-linux-gnu.tar.gz"
          echo "${QDRANT_SHA256}  qdrant.tar.gz" | sha256sum -c -
          tar xzf qdrant.tar.gz
          sudo mv qdrant /usr/local/bin/

      - uses: actions/download-artifact@v8
        with:
          name: fastembed-cache
          path: ${{ github.workspace }}/.ferrex/models

      - uses: actions/download-artifact@v8
        with:
          name: integration-archive

      - name: Run test
        run: >
          cargo nextest run
          --archive-file ferrex-integration.tar.zst
          --workspace-remap .
          --no-capture
          -E 'package(=${{ matrix.package }}) & test(=${{ matrix.test }})'

  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install ruff

      - name: Ruff check
        run: ruff check .github/scripts/

      - name: Ruff format
        run: ruff format --check .github/scripts/
