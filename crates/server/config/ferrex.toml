[deduplication]
# Cosine similarity above which non-semantic memories are rejected as
# near-duplicates. Semantic facts skip this; they use conflict resolution instead.
threshold = 0.95

[conflict]
# Fuzzy string ratio (jaro_winkler) on the object field, after normalization.
# >= object_fuzzy_duplicate → reject as duplicate.
# <  object_fuzzy_update    → accept as update (invalidate old).
# in between                → ambiguous; reject with ConflictAmbiguous and
#                             require the agent to retry with `supersedes`.
object_fuzzy_duplicate = 0.95
object_fuzzy_update    = 0.50

# Default predicate equivalence groups for common software vocabulary.
# Namespaces can override these (see below).
[predicates.groups]
depends_on    = ["uses", "depends-on", "requires", "needs", "imports"]
has_version   = ["version", "at-version", "pinned-to", "version-is"]
is_a          = ["is-a", "type-of", "kind-of", "instance-of"]
part_of       = ["belongs-to", "member-of", "contained-in"]
written_in    = ["language-is", "built-with", "uses-language"]
hosted_at     = ["lives-at", "repo-at", "url-is", "found-at"]
runs_on       = ["deployed-to", "hosted-on", "serves-from"]
maintained_by = ["owned-by", "managed-by", "authored-by", "led-by"]

# Per-namespace overrides merge on top of [predicates.groups]:
# a named group replaces the global of the same name, an empty
# list suppresses the global, and unnamed globals pass through.
#
# [namespaces.legal-research.predicates.groups]
# cites     = ["references", "quotes", "relies-on"]
# runs_on   = []   # suppress inherited group

[reconciliation]
# Optional periodic audit. When set, the server runs the audit loop
# every N hours in the background. Leave unset to run manually via
# `ferrex audit reconcile`.
# audit_interval_hours = 24
# Max entries to fix per audit run.
audit_fix_limit = 1000

# SQLite reader pool size. Writes use a single connection; reads spread across the pool.
reader_pool_size = 4

# score = weight_age * age_decay + weight_access * access_decay
#        + weight_validated * validation_decay + weight_count * count_freshness
[staleness]
weight_age = 0.40
weight_access = 0.25
weight_validated = 0.25
weight_count = 0.10
count_scale = 10.0

[staleness.episodic]
half_life_days = 30
stale_threshold = 0.70

[staleness.semantic]
half_life_days = 180
stale_threshold = 0.80

[staleness.procedural]
half_life_days = 365
stale_threshold = 0.90

# Capacities in number of entries, not bytes.
[cache]
embedding_capacity = 256
result_capacity = 128
