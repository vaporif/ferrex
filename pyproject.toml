[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ferrex"
dynamic = ["version"]
description = "Local-first MCP memory server for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["mcp", "memory", "ai-agents", "rag", "embeddings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/vaporif/ferrex"

[tool.maturin]
manifest-path = "crates/server/Cargo.toml"
bindings = "bin"
