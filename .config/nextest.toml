[profile.default]

[[profile.default.overrides]]
filter = 'package(ferrex-core) & kind(test)'
test-group = 'serial-integration'

[[profile.default.overrides]]
filter = 'package(ferrex-server) & kind(test)'
test-group = 'serial-integration'

[test-groups.serial-integration]
max-threads = 1

# Coverage runs every test, integration ones included, so it needs qdrant and models.
[profile.coverage]
slow-timeout = { period = "60s", terminate-after = 10 }
